<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
  <title id="title">FilingsIQ end-to-end architecture and project flow</title>
  <desc id="description">The SEC filing ingestion and indexing workflow feeds a ChromaDB index. At runtime, Streamlit accepts a question, filters by company, retrieves excerpts with FastEmbed and ChromaDB, generates and verifies a Groq answer, and displays citations and SEC links.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 750; letter-spacing: -1px; }
      .subtitle { font-size: 17px; fill: #475569; }
      .section { font-size: 18px; font-weight: 700; fill: #334155; letter-spacing: .3px; }
      .card-title { font-size: 17px; font-weight: 700; }
      .card-copy { font-size: 14px; fill: #475569; }
      .mini { font-size: 13px; fill: #64748b; }
      .number { font-size: 13px; font-weight: 700; fill: white; }
    </style>
  </defs>

  <rect width="1600" height="1080" rx="24" fill="url(#background)"/>
  <rect x="0" y="0" width="1600" height="11" rx="5" fill="url(#brand)"/>
  <text x="72" y="82" class="title">FilingsIQ · Complete project flow</text>
  <text x="72" y="116" class="subtitle">From public SEC filings to source-linked, LLM-assisted research in Streamlit</text>

  <rect x="56" y="151" width="1488" height="364" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="56" y="151" width="8" height="364" rx="4" fill="#0891b2"/>
  <text x="88" y="193" class="section">01 · OFFLINE INGESTION &amp; INDEX BUILD</text>
  <text x="88" y="220" class="mini">Run when creating or refreshing the local ChromaDB snapshot</text>

  <g filter="url(#shadow)">
    <rect x="88" y="260" width="202" height="158" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
    <rect x="324" y="260" width="202" height="158" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="560" y="260" width="202" height="158" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="796" y="260" width="202" height="158" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <rect x="1032" y="260" width="202" height="158" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="1268" y="260" width="224" height="158" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  </g>

  <g>
    <circle cx="112" cy="283" r="15" fill="#0891b2"/><text x="112" y="288" text-anchor="middle" class="number">1</text>
    <text x="112" y="321" class="card-title">SEC EDGAR</text>
    <text x="112" y="349" class="card-copy">Apple · Microsoft</text>
    <text x="112" y="370" class="card-copy">NVIDIA · latest 10-K</text>
    <text x="112" y="396" class="mini">Submissions + filing HTML</text>

    <circle cx="348" cy="283" r="15" fill="#64748b"/><text x="348" y="288" text-anchor="middle" class="number">2</text>
    <text x="348" y="321" class="card-title">Download &amp; extract</text>
    <text x="348" y="349" class="card-copy">download_filings.py</text>
    <text x="348" y="370" class="card-copy">HTML → plain text</text>
    <text x="348" y="396" class="mini">data/raw/ (local only)</text>

    <circle cx="584" cy="283" r="15" fill="#64748b"/><text x="584" y="288" text-anchor="middle" class="number">3</text>
    <text x="584" y="321" class="card-title">Split into chunks</text>
    <text x="584" y="349" class="card-copy">chunk_filings.py</text>
    <text x="584" y="370" class="card-copy">1,000 chars · 200 overlap</text>
    <text x="584" y="396" class="mini">Text + filing metadata</text>

    <circle cx="820" cy="283" r="15" fill="#4f46e5"/><text x="820" y="288" text-anchor="middle" class="number">4</text>
    <text x="820" y="321" class="card-title">Embed chunks</text>
    <text x="820" y="349" class="card-copy">FastEmbed</text>
    <text x="820" y="370" class="card-copy">BAAI/bge-small-en-v1.5</text>
    <text x="820" y="396" class="mini">Vectors + metadata</text>

    <circle cx="1056" cy="283" r="15" fill="#64748b"/><text x="1056" y="288" text-anchor="middle" class="number">5</text>
    <text x="1056" y="321" class="card-title">Build vector index</text>
    <text x="1056" y="349" class="card-copy">build_vector_db.py</text>
    <text x="1056" y="370" class="card-copy">Persist documents + vectors</text>
    <text x="1056" y="396" class="mini">Rebuild replaces collection</text>

    <circle cx="1292" cy="283" r="15" fill="#059669"/><text x="1292" y="288" text-anchor="middle" class="number">6</text>
    <text x="1292" y="321" class="card-title">ChromaDB snapshot</text>
    <text x="1292" y="349" class="card-copy">filingsiq_10k collection</text>
    <text x="1292" y="370" class="card-copy">1,090 indexed excerpts</text>
    <text x="1292" y="396" class="mini">chroma_db/ · deployed with app</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M292 339 H315"/><path d="M528 339 H551"/><path d="M764 339 H787"/>
    <path d="M1000 339 H1023"/><path d="M1236 339 H1259"/>
  </g>

  <rect x="56" y="541" width="1488" height="414" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="56" y="541" width="8" height="414" rx="4" fill="#4f46e5"/>
  <text x="88" y="584" class="section">02 · LIVE RESEARCH REQUEST</text>
  <text x="88" y="611" class="mini">Streamlit app · app.py → src/agent/basic_rag.py</text>

  <g filter="url(#shadow)">
    <rect x="88" y="661" width="184" height="166" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <rect x="306" y="661" width="184" height="166" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="524" y="661" width="184" height="166" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
    <rect x="742" y="661" width="184" height="166" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
    <rect x="960" y="661" width="184" height="166" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="1178" y="661" width="184" height="166" rx="16" fill="#fdf2f8" stroke="#fbcfe8"/>
    <rect x="1396" y="661" width="116" height="166" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
  </g>

  <g>
    <circle cx="110" cy="684" r="15" fill="#4f46e5"/><text x="110" y="689" text-anchor="middle" class="number">1</text>
    <text x="110" y="722" class="card-title">Ask in Streamlit</text>
    <text x="110" y="750" class="card-copy">Question + company</text>
    <text x="110" y="771" class="card-copy">filter (optional)</text>
    <text x="110" y="804" class="mini">app.py</text>

    <circle cx="328" cy="684" r="15" fill="#64748b"/><text x="328" y="689" text-anchor="middle" class="number">2</text>
    <text x="328" y="722" class="card-title">Detect company</text>
    <text x="328" y="750" class="card-copy">Names / ticker aliases</text>
    <text x="328" y="771" class="card-copy">filter retrieval scope</text>
    <text x="328" y="804" class="mini">Question takes priority</text>

    <circle cx="546" cy="684" r="15" fill="#4f46e5"/><text x="546" y="689" text-anchor="middle" class="number">3</text>
    <text x="546" y="722" class="card-title">Embed question</text>
    <text x="546" y="750" class="card-copy">FastEmbed query vector</text>
    <text x="546" y="771" class="card-copy">same embedding model</text>
    <text x="546" y="804" class="mini">Cached per process</text>

    <circle cx="764" cy="684" r="15" fill="#059669"/><text x="764" y="689" text-anchor="middle" class="number">4</text>
    <text x="764" y="722" class="card-title">Retrieve evidence</text>
    <text x="764" y="750" class="card-copy">ChromaDB semantic search</text>
    <text x="764" y="771" class="card-copy">5 excerpts, or 3/company</text>
    <text x="764" y="804" class="mini">Text + source metadata</text>

    <circle cx="982" cy="684" r="15" fill="#ea580c"/><text x="982" y="689" text-anchor="middle" class="number">5</text>
    <text x="982" y="722" class="card-title">Generate answer</text>
    <text x="982" y="750" class="card-copy">Groq uses retrieved text</text>
    <text x="982" y="771" class="card-copy">with [Source N] labels</text>
    <text x="982" y="804" class="mini">No outside evidence</text>

    <circle cx="1200" cy="684" r="15" fill="#db2777"/><text x="1200" y="689" text-anchor="middle" class="number">6</text>
    <text x="1200" y="722" class="card-title">Check &amp; review</text>
    <text x="1200" y="750" class="card-copy">Citation number exists?</text>
    <text x="1200" y="771" class="card-copy">Groq claim review</text>
    <text x="1200" y="804" class="mini">PASS or REVIEW</text>

    <circle cx="1418" cy="684" r="15" fill="#0891b2"/><text x="1418" y="689" text-anchor="middle" class="number">7</text>
    <text x="1418" y="722" class="card-title">Show</text>
    <text x="1418" y="750" class="card-copy">Answer,</text>
    <text x="1418" y="771" class="card-copy">sources &amp;</text>
    <text x="1418" y="792" class="card-copy">SEC links</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M274 744 H297"/><path d="M492 744 H515"/><path d="M710 744 H733"/>
    <path d="M928 744 H951"/><path d="M1146 744 H1169"/><path d="M1364 744 H1387"/>
  </g>

  <g fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#blueArrow)">
    <path d="M1380 418 V472 H834 V650"/>
  </g>
  <rect x="1082" y="453" width="324" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="1244" y="475" text-anchor="middle" class="mini" fill="#4338ca">Indexed excerpts feed the runtime retriever</text>

  <rect x="88" y="869" width="1424" height="52" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="112" y="901" class="card-copy"><tspan font-weight="700">Runtime credentials:</tspan> GROQ_API_KEY + GROQ_MODEL from Streamlit Secrets or environment / local .env; secrets are never in the index.</text>

  <text x="72" y="1001" class="mini">Important: citation checks verify source-number references; LLM claim review is not a guarantee. Always inspect the original SEC filing.</text>
  <text x="72" y="1031" class="mini">The committed ChromaDB index is a snapshot. Rebuild and redeploy it to refresh filing coverage.</text>
  <text x="1528" y="1031" text-anchor="end" class="mini">FilingsIQ · Architecture</text>
</svg>
